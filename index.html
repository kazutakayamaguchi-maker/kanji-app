<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1e1b18;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #312b26;
      border: 4px solid #191613;
      padding: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid #191613;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .card {
      background-color: #3b352f;
      border: 3px solid #191613;
      padding: 16px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 20px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: #fdf55f;
      border-bottom: 3px dashed #fdf55f;
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      border-radius: 4px;
    }

    .btn-action {
      background-color: #4a7c29;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 24px;
      border: 3px solid #000;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-sub {
      background-color: #727272;
      color: #fff;
      padding: 6px 12px;
      border: 2px solid #000;
      cursor: pointer;
    }

    .btn-gold { background-color: #c6a100; color: #000; }
    .btn-green { background-color: #4a7c29; }
    .btn-danger { background-color: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid #494038;
      padding: 12px;
      margin-bottom: 12px;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid #4a7c29;
      color: #fdf55f;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid #4cedd9;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 52px;
      color: #fdf55f;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div>⛏️ LEVEL: <span style="color:#fdf55f;">1</span></div>

    <div class="task-item">
      <div style="font-size:18px; margin-bottom:6px;">📅 <strong>2026-11-03 のドリル</strong></div>
      <button class="btn-action" onclick="forceStartDrill('2026-11-03')">▶ 挑戦する（スタート）</button>
    </div>

    <div class="task-item">
      <div>📅 <strong>2026-11-02 のドリル</strong></div>
      <div style="color:#aaa; font-weight:bold;">✅ 完了済み</div>
    </div>

    <div class="task-item">
      <div>📅 <strong>2026-11-01 のドリル</strong></div>
      <div style="color:#aaa; font-weight:bold;">✅ 完了済み</div>
    </div>

    <div class="task-item">
      <div>📅 <strong>2026-10-31 のドリル</strong></div>
      <div style="color:#aaa; font-weight:bold;">✅ 完了済み</div>
    </div>

    <hr style="border-color:#494038; margin:16px 0 12px 0;">

    <h4 style="color:#4cedd9; margin:0 0 8px 0;">🏆 クリアした日の記録（スタンプ帳）</h4>
    <div id="history-list-area">
      <div class="history-item"><span>✅ 2026-11-02 ドリル達成！</span><span>💎 CLEAR</span></div>
      <div class="history-item"><span>✅ 2026-11-01 ドリル達成！</span><span>💎 CLEAR</span></div>
      <div class="history-item"><span>✅ 2026-10-31 ドリル達成！</span><span>💎 CLEAR</span></div>
    </div>
  </div>

  <!-- 問題カード -->
  <div class="card" id="main-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn-sub" onclick="showMenu()">🔙 一覧へ</button>
      <span id="q-number">第 1 / 10 問</span>
    </div>

    <div class="question-box" id="q-sentence">読み込み中...</div>

    <!-- キャンバス -->
    <div style="text-align:center; margin:10px 0;">
      <canvas id="handwrite-canvas" width="320" height="160"></canvas>
      <div style="margin-top:12px; display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub" onclick="clearCanvas()">🧼 けす</button>
        <button class="btn-sub btn-gold" id="btn-check" onclick="showAnswer()">🔍 答えあわせ</button>
      </div>
    </div>

    <!-- 答えあわせ -->
    <div class="answer-panel" id="answer-panel">
      <div>正解（せいかい）:</div>
      <div class="answer-kanji" id="ans-kanji">命</div>
      <div id="ans-reading" style="font-size:14px; color:#ccc; margin-bottom:8px;"></div>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub btn-green" onclick="evaluateResult(true)">⭕ 書けた！</button>
        <button class="btn-sub btn-danger" onclick="evaluateResult(false)">❌ 書けなかった</button>
      </div>
    </div>
  </div>

  <!-- クリア画面 -->
  <div class="card" id="clear-card" style="display:none; text-align:center;">
    <h2 style="color:#fdf55f;">🎉 クリアおめでとう！</h2>
    <p id="clear-date-text"></p>
    <div style="font-size:48px; margin:16px 0;">💎</div>
    <p id="send-status" style="font-size:12px; color:#4cedd9;"></p>
    <button class="btn-sub btn-green" onclick="showMenu()">ドリル一覧にもどる</button>
  </div>
</div>
