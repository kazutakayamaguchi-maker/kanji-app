<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    :root {
      --mc-dirt: #5c4033;
      --mc-grass: #4a7c29;
      --mc-stone: #737373;
      --mc-wood: #866043;
      --mc-diamond: #4cedd9;
      --mc-gold: #fdf55f;
      --mc-dark-bg: #1e1b18;
      --mc-panel: #312b26;
      --mc-border-light: #494038;
      --mc-border-dark: #191613;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--mc-dark-bg);
      color: #ffffff;
      font-family: 'DotGothic16', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      background-color: var(--mc-panel);
      border: 4px solid var(--mc-border-dark);
      box-shadow: inset -4px -4px 0px 0px var(--mc-border-dark), inset 4px 4px 0px 0px var(--mc-border-light);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #211c18;
      padding: 10px 14px;
      border: 2px solid var(--mc-border-dark);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
    }

    .xp-bar-container {
      background: #111;
      border: 2px solid #000;
      height: 16px;
      width: 100%;
      position: relative;
      margin-top: 4px;
    }

    .xp-bar-fill {
      background: #55ff55;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .xp-text {
      position: absolute;
      top: -2px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #fff;
      text-shadow: 1px 1px #000;
    }

    /* カードデザイン */
    .card {
      background-color: #3b352f;
      border: 3px solid var(--mc-border-dark);
      padding: 16px;
      position: relative;
    }

    .card-title {
      font-size: 14px;
      color: var(--mc-diamond);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-grade {
      background: var(--mc-grass);
      padding: 2px 6px;
      border-radius: 2px;
      color: #fff;
      font-size: 12px;
    }

    .question-box {
      font-size: 22px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
      min-height: 70px;
      word-break: break-all;
    }

    .target-word {
      color: var(--mc-gold);
      border-bottom: 3px dashed var(--mc-gold);
      padding: 0 4px;
      font-weight: bold;
    }

    /* 手書き領域 */
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    canvas {
      background: #ffffff;
      border: 4px solid var(--mc-wood);
      touch-action: none;
      cursor: crosshair;
      border-radius: 4px;
    }

    .canvas-tools {
      display: flex;
      gap: 8px;
    }

    /* ボタン */
    .btn {
      background: #727272;
      border: 3px solid #000;
      box-shadow: inset -2px -2px 0 0 #373737, inset 2px 2px 0 0 #fff;
      color: #fff;
      padding: 8px 16px;
      font-family: 'DotGothic16', monospace;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { box-shadow: inset 2px 2px 0 0 #373737, inset -2px -2px 0 0 #fff; }
    .btn-green { background: var(--mc-grass); }
    .btn-gold { background: #c6a100; color: #000; }
    .btn-danger { background: #a82a2a; }

    /* 答えあわせパネル */
    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid var(--mc-diamond);
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 56px;
      color: var(--mc-gold);
      margin: 4px 0;
      letter-spacing: 4px;
    }

    .answer-detail {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .eval-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    /* 日付タスクリスト */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .task-item {
      background: #211c18;
      border: 2px solid var(--mc-border-light);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .task-item:hover { border-color: var(--mc-diamond); }
    .task-item.completed { opacity: 0.5; cursor: default; border-color: #444; }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal {
      background: var(--mc-panel);
      border: 4px solid var(--mc-border-light);
      padding: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      background: #111;
      color: #fff;
      border: 2px solid var(--mc-border-light);
      padding: 8px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div class="status-item">
      <span>⛏️ LEVEL:</span>
      <span id="level-num" style="color:var(--mc-gold); font-size:20px;">1</span>
    </div>
    <div class="status-item">
      <span>🔥 完了日数:</span>
      <span id="streak-num" style="color:var(--mc-diamond);">0日</span>
    </div>
    <button class="btn" onclick="openAdmin()" style="font-size:12px; padding:4px 8px;">⚙️ 保護者設定</button>
  </div>

  <!-- 経験値バー -->
  <div>
    <div class="xp-bar-container">
      <div class="xp-bar-fill" id="xp-fill"></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
  </div>

  <!-- 日付選択画面 -->
  <div class="card" id="select-card">
    <h3 style="color:var(--mc-gold); margin-top:0;">📜 今日のドリルを選ぼう！</h3>
    <p style="font-size:14px; color:#ccc;">やれていない日の課題（未完了）を選んで挑戦してね！</p>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- メイン問題カード -->
  <div class="card" id="main-card" style="display:none;">
    <div class="card-title">
      <div>
        <button class="btn" onclick="showMenu()" style="font-size:10px; padding:2px 6px; margin-right:6px;">🔙 一覧へ</button>
        <span id="q-number">第 1 / 10 問</span>
      </div>
      <span id="q-grade" class="badge-grade">小学4年</span>
    </div>

    <div class="question-box" id="q-sentence">読み込み中...</div>

    <!-- 手書きキャンバス -->
    <div class="canvas-container">
      <canvas id="handwrite-canvas" width="320" height="160"></canvas>
      <div class="canvas-tools">
        <button class="btn" onclick="clearCanvas()">🧼 けす</button>
        <button class="btn btn-gold" id="btn-check" onclick="showAnswer()">🔍 答えあわせ</button>
      </div>
    </div>

    <!-- 模範解答エリア -->
    <div class="answer-panel" id="answer-panel">
      <div>正解（せいかい）:</div>
      <div class="answer-kanji" id="ans-kanji">召喚</div>
      <div class="answer-detail" id="ans-reading">読み: しょうかん</div>
      <div>自分で正解できたか選んでね！</div>
      <div class="eval-buttons" style="margin-top:10px;">
        <button class="btn btn-green" onclick="evaluateResult(true)">⭕ 書けた！（正解）</button>
        <button class="btn btn-danger" onclick="evaluateResult(false)">❌ 書けなかった（復習）</button>
      </div>
    </div>
  </div>

  <!-- クリア画面 -->
  <div class="card" id="clear-card" style="display:none; text-align:center;">
    <h2 style="color:var(--mc-gold);">🎉 クリアおめでとう！</h2>
    <p id="clear-date-text">今日の課題をクリアしました！</p>
    <div style="font-size:48px; margin:16px 0;">💎</div>
    <p id="send-status" style="font-size:12px; color:var(--mc-diamond);">保護者へ学習記録を送信中...</p>
    <button class="btn btn-green" onclick="showMenu()">ドリル一覧にもどる</button>
  </div>
</div>

<!-- 保護者管理モーダル -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <h3>⚙️ 保護者用管理モード</h3>
    <p style="font-size:12px; color:#aaa;">職場で問題を追加したり、間違えた問題リストを確認できます。</p>
    
    <h4>📌 復習待ちの問題リスト（優先出題されます）</h4>
    <div id="wrong-list-box" style="background:#111; padding:8px; max-height:120px; overflow-y:auto; font-size:12px; margin-bottom:8px;">なし</div>
    <button class="btn btn-danger" onclick="resetWrongList()"
