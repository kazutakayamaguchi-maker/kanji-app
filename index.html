<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1e1b18;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #312b26;
      border: 4px solid #191613;
      padding: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid #191613;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .card {
      background-color: #3b352f;
      border: 3px solid #191613;
      padding: 16px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 20px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: #fdf55f;
      border-bottom: 3px dashed #fdf55f;
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      border-radius: 4px;
    }

    .btn-action {
      background-color: #4a7c29;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 16px 24px;
      border: 3px solid #000;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      display: block;
      text-align: center;
    }

    .btn-sub {
      background-color: #727272;
      color: #fff;
      padding: 6px 12px;
      border: 2px solid #000;
      cursor: pointer;
    }

    .btn-gold { background-color: #c6a100; color: #000; }
    .btn-green { background-color: #4a7c29; }
    .btn-danger { background-color: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid #494038;
      padding: 12px;
      margin-bottom: 12px;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid #4a7c29;
      color: #fdf55f;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid #4cedd9;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 52px;
      color: #fdf55f;
      margin: 4px 0;
    }
  </style>
</head>
