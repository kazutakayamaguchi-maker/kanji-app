<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1e1b18;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #312b26;
      border: 4px solid #191613;
      padding: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid #191613;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .card {
      background-color: #3b352f;
      border: 3px solid #191613;
      padding: 16px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 20px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: #fdf55f;
      border-bottom: 3px dashed #fdf55f;
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      border-radius: 4px;
    }

    .btn-action {
      background-color: #4a7c29;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 12px 24px;
      border: 3px solid #000;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-sub {
      background-color: #727272;
      color: #fff;
      padding: 6px 12px;
      border: 2px solid #000;
      cursor: pointer;
    }

    .btn-gold { background-color: #c6a100; color: #000; }
    .btn-green { background-color: #4a7c29; }
    .btn-danger { background-color: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid #494038;
      padding: 12px;
      margin-bottom: 12px;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid #4a7c29;
      color: #fdf55f;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid #4cedd9;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 52px;
      color: #fdf55f;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div>⛏️ LEVEL: <span style="color:#fdf55f;">1</span></div>
    <div>🔥 頑張った日数: <span id="streak-num" style="color:#4cedd9;">2日</span></div>
  </div>

  <!-- トップ画面 -->
  <div class="card" id="select-card">
    <h3 style="color:#fdf55f; margin:0 0 12px 0;">📜 今日のドリルを選ぼう！</h3>
    
    <div id="task-list-area"></div>

    <hr style="border-color:#494038; margin:16px 0 12px 0;">

    <h4 style="color:#4cedd9; margin:0 0 8px 0;">🏆 クリアした日の記録（スタンプ帳）</h4>
    <div id="history-list-area"></div>
  </div>

  <!-- 問題カード -->
  <div class="card" id="main-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn-sub" onclick="showMenu()">🔙 一覧へ</button>
      <span id="q-number">第 1 / 10 問</span>
    </div>

    <div class="question-box" id="q-sentence">読み込み中...</div>

    <!-- キャンバス -->
    <div style="text-align:center; margin:10px 0;">
      <canvas id="handwrite-canvas" width="320" height="160"></canvas>
      <div style="margin-top:12px; display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub" onclick="clearCanvas()">🧼 けす</button>
        <button class="btn-sub btn-gold" id="btn-check" onclick="showAnswer()">🔍 答えあわせ</button>
      </div>
    </div>

    <!-- 答えあわせ -->
    <div class="answer-panel" id="answer-panel">
      <div>正解（せいかい）:</div>
      <div class="answer-kanji" id="ans-kanji">建築</div>
      <div id="ans-reading" style="font-size:14px; color:#ccc; margin-bottom:8px;"></div>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub btn-green" onclick="evaluateResult(true)">⭕ 書けた！</button>
        <button class="btn-sub btn-danger" onclick="evaluateResult(false)">❌ 書けなかった</button>
      </div>
    </div>
  </div>

  <!-- クリア画面 -->
  <div class="card" id="clear-card" style="display:none; text-align:center;">
    <h2 style="color:#fdf55f;">🎉 クリアおめでとう！</h2>
    <p id="clear-date-text"></p>
    <div style="font-size:48px; margin:16px 0;">💎</div>
    <p id="send-status" style="font-size:12px; color:#4cedd9;"></p>
    <button class="btn-sub btn-green" onclick="showMenu()">ドリル一覧にもどる</button>
  </div>
</div>

<script>
var GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyU9y0O5XWXg9QJZ8FvzgY9iV0HTA1pwe7fydhLA8iCHPCYfzJtPkmupEZwK24NZBsW/exec";

// 11/02 精選問題セット（全10問）
var QUESTIONS_1102 = [
  { grade: 4, sentence: "巨大なタワーの(ケンチク)を開始する。", target: "ケンチク", answer: "建築", reading: "けんちく" },
  { grade: 4, sentence: "チェストの(イシ)ブロックを取り出す。", target: "イシ", answer: "石", reading: "いし" },
  { grade: 4, sentence: "マグマに落ちないよう(チュウイ)して進む。", target: "チュウイ", answer: "注意", reading: "ちゅうい" },
  { grade: 4, sentence: "ネザー要塞で(キチョウ)な素材を見つける。", target: "キチョウ", answer: "貴重", reading: "きちょう" },
  { grade: 4, sentence: "水流を使って(ジドウ)で収穫する農園を作る。", target: "ジドウ", answer: "自動", reading: "じどう" },
  { grade: 4, sentence: "村人とのトレードで(コウカン)をする。", target: "コウカン", answer: "交換", reading: "こうかん" },
  { grade: 4, sentence: "夜になるとモンスターが(シュツゲン)する。", target: "シュツゲン", answer: "出現", reading: "しゅつげん" },
  { grade: 4, sentence: "ダイヤの剣に強いエンチャントを(ツ)ける。", target: "ツ", answer: "付", reading: "つける" },
  { grade: 4, sentence: "洞窟の暗闇を松明で(テ)らす。", target: "テ", answer: "照", reading: "てらす" },
  { grade: 3, sentence: "ゾンビの攻撃を剣で(フセ)ぐ。", target: "フセ", answer: "防", reading: "ふせぐ" }
];

// 初期データ（10/31と11/01を完了済みとして記憶）
var appState = { xp: 0, level: 1, completedDates: ["2026-10-31", "2026-11-01"] };
var selectedDateStr = "";
var currentQuestions = [];
var currentIndex = 0;
var sessionCorrectCount = 0;
var sessionDetails = [];

window.onload = function() {
  initCanvas();
  loadData();
  renderTopMenu();
};

function loadData() {
  try {
    var saved = localStorage.getItem('mc_kanji_app_state_v2');
    if (saved) {
      appState = JSON.parse(saved);
      // 念のため過去の完了実績を保持補正
      if (!appState.completedDates.includes("2026-10-31")) appState.completedDates.push("2026-10-31");
      if (!appState.completedDates.includes("2026-11-01")) appState.completedDates.push("2026-11-01");
    } else {
      saveData();
    }
  } catch(e) {}
}

function saveData() {
  try {
    localStorage.setItem('mc_kanji_app_state_v2', JSON.stringify(appState));
  } catch(e) {}
}

// トップ画面の動的描画（完了状態の自動更新）
function renderTopMenu() {
  document.getElementById('streak-num').innerText = appState.completedDates.length + "日";

  var taskArea = document.getElementById('task-list-area');
  var historyArea = document.getElementById('history-list-area');

  // 1. 今日のドリルリスト描画
  var dates = ["2026-11-02", "2026-11-01", "2026-10-31"];
  var taskHtml = "";

  dates.forEach(function(dStr) {
    var isDone = appState.completedDates.indexOf(dStr) !== -1;
    taskHtml += '<div class="task-item">';
    taskHtml += '  <div style="font-size:18px; margin-bottom:6px;">📅 <strong>' + dStr + ' のドリル</strong></div>';
    if (isDone) {
      taskHtml += '  <div style="color:#aaa; font-weight:bold;">✅ 完了済み</div>';
    } else {
      taskHtml += '  <button class="btn-action" onclick="startDrill(\'' + dStr + '\')">▶ 挑戦する（スタート）</button>';
    }
    taskHtml += '</div>';
  });
  taskArea.innerHTML = taskHtml;

  // 2. スタンプ帳（クリア履歴）描画
  var historyHtml = "";
  var sortedDates = appState.completedDates.slice().reverse();
  sortedDates.forEach(function(dStr) {
    historyHtml += '<div class="history-item">';
    historyHtml += '  <span>✅ ' + dStr + ' ドリル達成！</span>';
    historyHtml += '  <span>💎 CLEAR</span>';
    historyHtml += '</div>';
  });
  historyArea.innerHTML = historyHtml;
}

function startDrill(dateStr) {
  selectedDateStr = dateStr;
  currentIndex = 0;
  sessionCorrectCount = 0;
  sessionDetails = [];

  currentQuestions = QUESTIONS_1102;

  document.getElementById('select-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'none';
  document.getElementById('main-card').style.display = 'block';
  
  renderQuestion();
}

function showMenu() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'none';
  document.getElementById('select-card').style.display = 'block';
  renderTopMenu();
}

function renderQuestion() {
  if (currentIndex >= currentQuestions.length) {
    finishDrill();
    return;
  }

  var q = currentQuestions[currentIndex];
  document.getElementById('q-number').innerText = '第 ' + (currentIndex + 1) + ' / ' + currentQuestions.length + ' 問';
  document.getElementById('q-sentence').innerHTML = q.sentence.replace(/\((.*?)\)/, '<span class="target-word">$1</span>');
  document.getElementById('answer-panel').style.display = 'none';
  document.getElementById('btn-check').style.display = 'inline-block';
  clearCanvas();
}

function showAnswer() {
  var q = currentQuestions[currentIndex];
  document.getElementById('ans-kanji').innerText = q.answer;
  document.getElementById('ans-reading').innerText = 'よみ: ' + q.reading;
  document.getElementById('answer-panel').style.display = 'block';
  document.getElementById('btn-check').style.display = 'none';
}

function evaluateResult(isCorrect) {
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  
  if (isCorrect) {
    sessionCorrectCount++;
    sessionDetails.push(qNum + '問目: [小' + q.grade + '] ' + q.sentence + ' | 正解: ' + q.answer + ' | 結果: ⭕正解');
  } else {
    sessionDetails.push(qNum + '問目: [小' + q.grade + '] ' + q.sentence + ' | 正解: ' + q.answer + ' | 結果: ❌不正解');
  }
  currentIndex++;
  renderQuestion();
}

// 10問完了時の処理
function finishDrill() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'block';
  document.getElementById('clear-date-text').innerText = selectedDateStr + ' のドリル完了！';

  // 完了フラグの自動保存
  if (appState.completedDates.indexOf(selectedDateStr) === -1) {
    appState.completedDates.push(selectedDateStr);
    saveData();
  }

  sendResultToSheet();
}

function sendResultToSheet() {
  var statusElem = document.getElementById('send-status');
  statusElem.innerText = "詳細な学習記録を送信中...";
  
  var payload = {
    dateStr: selectedDateStr,
    score: sessionCorrectCount,
    total: currentQuestions.length,
    details: sessionDetails
  };

  fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    statusElem.innerText = "✅ スプレッドシートへ詳細記録を送信完了！";
  }).catch(function() {
    statusElem.innerText = "⚠️ 送信できませんでした。";
  });
}

// キャンバス描画機能
var canvas, ctx, isDrawing = false;
function initCanvas() {
  canvas = document.getElementById('handwrite-canvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    startDrawing({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    draw({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
  isDrawing = true;
  ctx.beginPath();
  var rect = canvas.getBoundingClientRect();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#222';
}

function draw(e) {
  if (!isDrawing) return;
  var rect = canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.stroke();
}

function stopDrawing() { isDrawing = false; }

function clearCanvas() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(160, 0); ctx.lineTo(160, 160);
  ctx.stroke();
}
</script>

</body>
</html>
