<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    :root {
      --mc-dark-bg: #1e1b18;
      --mc-panel: #312b26;
      --mc-border-light: #494038;
      --mc-border-dark: #191613;
      --mc-grass: #4a7c29;
      --mc-gold: #fdf55f;
      --mc-diamond: #4cedd9;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--mc-dark-bg);
      color: #ffffff;
      font-family: 'DotGothic16', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      background-color: var(--mc-panel);
      border: 4px solid var(--mc-border-dark);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid var(--mc-border-dark);
    }

    .card {
      background-color: #3b352f;
      border: 3px solid var(--mc-border-dark);
      padding: 16px;
    }

    .question-box {
      font-size: 22px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: var(--mc-gold);
      border-bottom: 3px dashed var(--mc-gold);
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      cursor: crosshair;
      border-radius: 4px;
    }

    .btn {
      background: #727272;
      border: 3px solid #000;
      color: #fff;
      padding: 8px 16px;
      font-family: 'DotGothic16', monospace;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-green { background: var(--mc-grass); }
    .btn-gold { background: #c6a100; color: #000; }
    .btn-danger { background: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid var(--mc-border-light);
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid var(--mc-grass);
      color: var(--mc-gold);
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid var(--mc-diamond);
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 56px;
      color: var(--mc-gold);
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div>⛏️ LEVEL: <span id="level-num" style="color:var(--mc-gold);">1</span></div>
    <div>🔥 頑張った日数: <span id="streak-num" style="color:var(--mc-diamond);">0日</span></div>
    <button class="btn btn-danger" onclick="resetAllData()" style="font-size:10px; padding:2px 6px;">🧹 リセット</button>
  </div>

  <div id="error-box" style="display:none; background:#a82a2a; padding:10px; border:2px solid #fff; font-size:12px;"></div>

  <!-- トップ画面 -->
  <div class="card" id="select-card">
    <h3 style="color:var(--mc-gold); margin:0 0 8px 0;">📜 今日のドリルを選ぼう！</h3>
    <div id="task-list"></div>

    <hr style="border-color:var(--mc-border-light); margin:16px 0 12px 0;">

    <h4 style="color:var(--mc-diamond); margin:0 0 8px 0;">🏆 クリアした日の記録（スタンプ帳）</h4>
    <div id="history-list">
      <div style="font-size:12px; color:#aaa;">まだ完了したドリルはありません。1つ目をクリアしよう！</div>
    </div>
  </div>

  <!-- 問題カード -->
  <div class="card" id="main-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn" onclick="showMenu()" style="font-size:10px; padding:2px 6px;">🔙 一覧へ</button>
      <span id="q-number">第 1 / 10 問</span>
    </div>

    <div class="question-box" id="q-sentence">読み込み中...</div>

    <!-- キャンバス -->
    <div style="text-align:center; margin:10px 0;">
      <canvas id="handwrite-canvas" width="320" height="160"></canvas>
      <div style="margin-top:8px;">
        <button class="btn" onclick
