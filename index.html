<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1e1b18;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #312b26;
      border: 4px solid #191613;
      padding: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid #191613;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .card {
      background-color: #3b352f;
      border: 3px solid #191613;
      padding: 16px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 20px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: #fdf55f;
      border-bottom: 3px dashed #fdf55f;
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      border-radius: 4px;
    }

    /* 極めてシンプルな押しやすい大ボタン */
    .btn-action {
      background-color: #4a7c29;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 12px 24px;
      border: 3px solid #000;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-sub {
      background-color: #727272;
      color: #fff;
      padding: 6px 12px;
      border: 2px solid #000;
      cursor: pointer;
    }

    .btn-gold { background-color: #c6a100; color: #000; }
    .btn-green { background-color: #4a7c29; }
    .btn-danger { background-color: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid #494038;
      padding: 12px;
      margin-bottom: 12px;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid #4a7c29;
      color: #fdf55f;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid #4cedd9;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 52px;
      color: #fdf55f;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div>⛏️ LEVEL: <span style="color:#fdf55f;">1</span></div>
    <div>🔥 頑張った日数: <span style="color:#4cedd9;">1日</span></div>
  </div>

  <!-- トップ画面 -->
  <div class="card" id="select-card">
    <h3 style="color:#fdf55f; margin:0 0 12px 0;">📜 今日のドリルを選ぼう！</h3>
    
    <div class="task-item">
      <div style="font-size:18px; margin-bottom:8px;">📅 <strong>2026-11-01 のドリル</strong></div>
      <button class="btn-action" onclick="startDrill('2026-11-01')">▶ 挑戦する（スタート）</button>
    </div>
    
    <div class="task-item">
      <div>📅 <strong>2026-10-31 のドリル</strong></div>
      <div style="color:#aaa; margin-top:4px;">✅ 完了済み</div>
    </div>

    <hr style="border-color:#494038; margin:16px 0 12px 0;">

    <h4 style="color:#4cedd9; margin:0 0 8px 0;">🏆 クリアした日の記録（スタンプ帳）</h4>
    <div class="history-item">
      <span>✅ 2026-10-31 ドリル達成！</span>
      <span>💎 CLEAR</span>
    </div>
  </div>

  <!-- 問題カード -->
  <div class="card" id="main-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn-sub" onclick="showMenu()">🔙 一覧へ</button>
      <span id="q-number">第 1 / 10 問</span>
    </div>

    <div class="question-box" id="q-sentence">読み込み中...</div>

    <!-- キャンバス -->
    <div style="text-align:center; margin:10px 0;">
      <canvas id="handwrite-canvas" width="320" height="160"></canvas>
      <div style="margin-top:12px; display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub" onclick="clearCanvas()">🧼 けす</button>
        <button class="btn-sub btn-gold" id="btn-check" onclick="showAnswer()">🔍 答えあわせ</button>
      </div>
    </div>

    <!-- 答えあわせ -->
    <div class="answer-panel" id="answer-panel">
      <div>正解（せいかい）:</div>
      <div class="answer-kanji" id="ans-kanji">探検</div>
      <div id="ans-reading" style="font-size:14px; color:#ccc; margin-bottom:8px;"></div>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn-sub btn-green" onclick="evaluateResult(true)">⭕ 書けた！</button>
        <button class="btn-sub btn-danger" onclick="evaluateResult(false)">❌ 書けなかった</button>
      </div>
    </div>
  </div>

  <!-- クリア画面 -->
  <div class="card" id="clear-card" style="display:none; text-align:center;">
    <h2 style="color:#fdf55f;">🎉 クリアおめでとう！</h2>
    <p id="clear-date-text"></p>
    <div style="font-size:48px; margin:16px 0;">💎</div>
    <p id="send-status" style="font-size:12px; color:#4cedd9;"></p>
    <button class="btn-sub btn-green" onclick="showMenu()">ドリル一覧にもどる</button>
  </div>
</div>

<script>
var GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyU9y0O5XWXg9QJZ8FvzgY9iV0HTA1pwe7fydhLA8iCHPCYfzJtPkmupEZwK24NZBsW/exec";

var QUESTIONS_1101 = [
  { grade: 4, sentence: "未知のネザー要塞を(タンケン)する。", target: "タンケン", answer: "探検", reading: "たんけん" },
  { grade: 4, sentence: "トロッコに乗って(コウソク)で移動する。", target: "コウソク", answer: "高速", reading: "こうそく" },
  { grade: 4, sentence: "敵の攻撃を(シズカ)にかわす。", target: "シズカ", answer: "静か", reading: "しずか" },
  { grade: 4, sentence: "拠点への(シンノウ)者を撃退する。", target: "シンノウ", answer: "侵入", reading: "しんにゅう" },
  { grade: 4, sentence: "拠点に(ギョウショウニン)がやってきた。", target: "ギョウショウニン", answer: "行商人", reading: "ぎょうしょうにん" },
  { grade: 4, sentence: "チェストの中身を(セイリ)する。", target: "セイリ", answer: "整理", reading: "せいり" },
  { grade: 4, sentence: "エンダーマンと目を合わさずに(タチサガル)。", target: "タチサガル", answer: "立ち去る", reading: "たちさる" },
  { grade: 4, sentence: "マグマの海に橋を(カケル)。", target: "カケル", answer: "架ける", reading: "かける" },
  { grade: 4, sentence: "ダイヤの装備で防御力を(カシコマク)高める。", target: "カシコマク", answer: "賢く", reading: "かしこく" },
  { grade: 3, sentence: "夜になる前に(ハヤク)家へ帰る。", target: "ハヤク", answer: "早く", reading: "はやく" }
];

var selectedDateStr = "";
var currentQuestions = [];
var currentIndex = 0;
var sessionCorrectCount = 0;
var sessionDetails = [];

window.onload = function() {
  initCanvas();
};

function startDrill(dateStr) {
  selectedDateStr = dateStr;
  currentIndex = 0;
  sessionCorrectCount = 0;
  sessionDetails = [];

  currentQuestions = QUESTIONS_1101;

  document.getElementById('select-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'none';
  document.getElementById('main-card').style.display = 'block';
  
  renderQuestion();
}

function showMenu() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'none';
  document.getElementById('select-card').style.display = 'block';
}

function renderQuestion() {
  if (currentIndex >= currentQuestions.length) {
    finishDrill();
    return;
  }

  var q = currentQuestions[currentIndex];
  document.getElementById('q-number').innerText = '第 ' + (currentIndex + 1) + ' / ' + currentQuestions.length + ' 問';
  document.getElementById('q-sentence').innerHTML = q.sentence.replace(/\((.*?)\)/, '<span class="target-word">$1</span>');
  document.getElementById('answer-panel').style.display = 'none';
  document.getElementById('btn-check').style.display = 'inline-block';
  clearCanvas();
}

function showAnswer() {
  var q = currentQuestions[currentIndex];
  document.getElementById('ans-kanji').innerText = q.answer;
  document.getElementById('ans-reading').innerText = 'よみ: ' + q.reading;
  document.getElementById('answer-panel').style.display = 'block';
  document.getElementById('btn-check').style.display = 'none';
}

function evaluateResult(isCorrect) {
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  
  if (isCorrect) {
    sessionCorrectCount++;
    sessionDetails.push(qNum + '問目: [小' + q.grade + '] ' + q.sentence + ' | 正解: ' + q.answer + ' | 結果: ⭕正解');
  } else {
    sessionDetails.push(qNum + '問目: [小' + q.grade + '] ' + q.sentence + ' | 正解: ' + q.answer + ' | 結果: ❌不正解');
  }
  currentIndex++;
  renderQuestion();
}

function finishDrill() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('clear-card').style.display = 'block';
  document.getElementById('clear-date-text').innerText = selectedDateStr + ' のドリル完了！';
  sendResultToSheet();
}

function sendResultToSheet() {
  var statusElem = document.getElementById('send-status');
  statusElem.innerText = "詳細な学習記録を送信中...";
  
  var payload = {
    dateStr: selectedDateStr,
    score: sessionCorrectCount,
    total: currentQuestions.length,
    details: sessionDetails
  };

  fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    statusElem.innerText = "✅ スプレッドシートへ詳細記録を送信完了！";
  }).catch(function() {
    statusElem.innerText = "⚠️ 送信できませんでした。";
  });
}

// キャンバス描画機能
var canvas, ctx, isDrawing = false;
function initCanvas() {
  canvas = document.getElementById('handwrite-canvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    startDrawing({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    draw({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
  isDrawing = true;
  ctx.beginPath();
  var rect = canvas.getBoundingClientRect();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#222';
}

function draw(e) {
  if (!isDrawing) return;
  var rect = canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.stroke();
}

function stopDrawing() { isDrawing = false; }

function clearCanvas() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(160, 0); ctx.lineTo(160, 160);
  ctx.stroke();
}
</script>

</body>
</html>
