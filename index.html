<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    :root {
      --mc-dirt: #5c4033;
      --mc-grass: #4a7c29;
      --mc-stone: #737373;
      --mc-wood: #866043;
      --mc-diamond: #4cedd9;
      --mc-gold: #fdf55f;
      --mc-dark-bg: #1e1b18;
      --mc-panel: #312b26;
      --mc-border-light: #494038;
      --mc-border-dark: #191613;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--mc-dark-bg);
      color: #ffffff;
      font-family: 'DotGothic16', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      background-color: var(--mc-panel);
      border: 4px solid var(--mc-border-dark);
      box-shadow: inset -4px -4px 0px 0px var(--mc-border-dark), inset 4px 4px 0px 0px var(--mc-border-light);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #211c18;
      padding: 10px 14px;
      border: 2px solid var(--mc-border-dark);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
    }

    .xp-bar-container {
      background: #111;
      border: 2px solid #000;
      height: 16px;
      width: 100%;
      position: relative;
      margin-top: 4px;
    }

    .xp-bar-fill {
      background: #55ff55;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .xp-text {
      position: absolute;
      top: -2px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #fff;
      text-shadow: 1px 1px #000;
    }

    /* カードデザイン */
    .card {
      background-color: #3b352f;
      border: 3px solid var(--mc-border-dark);
      padding: 16px;
      position: relative;
    }

    .card-title {
      font-size: 14px;
      color: var(--mc-diamond);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-grade {
      background: var(--mc-grass);
      padding: 2px 6px;
      border-radius: 2px;
      color: #fff;
      font-size: 12px;
    }

    .question-box {
      font-size: 22px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
      min-height: 70px;
      word-break: break-all;
    }

    .target-word {
      color: var(--mc-gold);
      border-bottom: 3px dashed var(--mc-gold);
      padding: 0 4px;
      font-weight: bold;
    }

    /* 手書き領域 */
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    canvas {
      background: #ffffff;
      border: 4px solid var(--mc-wood);
      touch-action: none;
      cursor: crosshair;
      border-radius: 4px;
    }

    .canvas-tools {
      display: flex;
      gap: 8px;
    }

    /* ボタン */
    .btn {
      background: #727272;
      border: 3px solid #000;
      box-shadow: inset -2px -2px 0 0 #373737, inset 2px 2px 0 0 #fff;
      color: #fff;
      padding: 8px 16px;
      font-family: 'DotGothic16', monospace;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { box-shadow: inset 2px 2px 0 0 #373737, inset -2px -2px 0 0 #fff; }
    .btn-green { background: var(--mc-grass); }
    .btn-gold { background: #c6a100; color: #000; }
    .btn-danger { background: #a82a2a; }

    /* 答えあわせパネル */
    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid var(--mc-diamond);
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 56px;
      color: var(--mc-gold);
      margin: 4px 0;
      letter-spacing: 4px;
    }

    .answer-detail {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .eval-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    /* 日付タスクリスト */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      max-height: 320px;
      overflow-y: auto;
    }

    .task-item {
      background: #211c18;
      border: 2px solid var(--mc-border-light);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-item.
