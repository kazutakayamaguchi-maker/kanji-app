<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクラ風 漢字ドリル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      padding: 12px;
      background-color: #1e1b18;
      color: #ffffff;
      font-family: 'DotGothic16', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background-color: #312b26;
      border: 4px solid #191613;
      padding: 16px;
      margin-top: 10px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #211c18;
      padding: 10px;
      border: 2px solid #191613;
      margin-bottom: 12px;
    }

    .card {
      background-color: #3b352f;
      border: 3px solid #191613;
      padding: 16px;
      margin-bottom: 12px;
    }

    .question-box {
      font-size: 20px;
      line-height: 1.6;
      margin: 12px 0;
      background: #28231e;
      padding: 12px;
      border: 2px solid #1a1714;
    }

    .target-word {
      color: #fdf55f;
      border-bottom: 3px dashed #fdf55f;
      font-weight: bold;
    }

    canvas {
      background: #ffffff;
      border: 4px solid #866043;
      touch-action: none;
      cursor: crosshair;
      border-radius: 4px;
    }

    .btn {
      background: #727272;
      border: 3px solid #000;
      color: #fff;
      padding: 8px 16px;
      font-family: 'DotGothic16', monospace;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-green { background: #4a7c29; }
    .btn-gold { background: #c6a100; color: #000; }
    .btn-danger { background: #a82a2a; }

    .task-item {
      background: #211c18;
      border: 2px solid #494038;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item {
      background: #1a1714;
      border: 1px solid #4a7c29;
      color: #fdf55f;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .answer-panel {
      display: none;
      background: #25201b;
      border: 2px solid #4cedd9;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .answer-kanji {
      font-size: 52px;
      color: #fdf55f;
      margin: 4px 0;
    }
  </style>
</head>

  <div class="header-bar">
